name: AGM vote results collection (EDINET)

# EDINET 臨時報告書から総会の議案別・候補者別賛成率を収集する。
# 3年分バックフィルの推奨実行（総会集中期をカバー、各回1実行）:
#   from=2024-06-10 to=2024-07-31
#   from=2025-06-10 to=2025-07-31
#   from=2026-06-10 to=2026-07-31
# 3月決算以外は総会が年間に分散するため、全期間なら 07-01〜翌06-30 を分割実行。
on:
  workflow_dispatch:
    inputs:
      from:
        description: "検索開始日 YYYY-MM-DD（臨時報告書は総会後2〜5営業日に提出）"
        required: true
      to:
        description: "検索終了日 YYYY-MM-DD"
        required: true
      extract_limit:
        description: "今回抽出する報告書の上限件数（pending は次回に持ち越し）"
        required: false
        default: "3000"
      company:
        description: "特定企業のみの場合の証券コード（例: 8088）。空白 = 全登録企業"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: vote-results-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover extraordinary reports (臨時報告書)
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.company }}" ]; then
            EXTRA_ARGS="--company=${{ github.event.inputs.company }}"
          fi
          node scripts/edinet-discover-vote-reports.mjs \
            --from=${{ github.event.inputs.from }} \
            --to=${{ github.event.inputs.to }} \
            --delay=1500 ${EXTRA_ARGS}

      - name: Extract vote results (賛成率)
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.company }}" ]; then
            EXTRA_ARGS="--company=${{ github.event.inputs.company }}"
          fi
          node scripts/edinet-extract-vote-results.mjs \
            --limit=${{ github.event.inputs.extract_limit }} \
            --delay=2000 ${EXTRA_ARGS}

      - name: Commit collected vote results
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/edinet_vote_reports.json || true
          git add data/generated/agm_vote_results_index.json || true
          if [ -d data/generated/agm_vote_results ]; then
            git add data/generated/agm_vote_results/
          fi
          git status --short | head -30
          if git diff --cached --quiet; then
            echo "No vote result changes."
          else
            git commit -m "Update AGM vote results (EDINET 臨時報告書 ${{ github.event.inputs.from }}〜${{ github.event.inputs.to }})"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
